# Added by the wow-vanilla-plus overlay, not by AzerothCore upstream.
#
# WHY THIS EXISTS
#   This fork is consumed as a git submodule by github.com/welo1997/wow-vanilla-plus.
#   Core C++ changes are committed HERE and the overlay only records the commit SHA,
#   so a pin-bump PR over there diffs as a single "Subproject commit" line — the
#   overlay's CI (gitleaks, shellcheck, PSScriptAnalyzer) scans nothing of substance
#   in it. Without this workflow, a credential committed into this repository would
#   pass every automated barrier in the project.
#
#   The overlay's pre-commit hook is NOT a substitute: a submodule has its own .git
#   config, so that hook only runs here if someone configured core.hooksPath on this
#   clone by hand. This is the backstop that does not depend on a local setup step.
#
# WHY IT SCANS A COMMIT RANGE AND NOT FULL HISTORY
#   The first version of this workflow ran `gitleaks detect` over the whole repo.
#   Measured on run 34047712638: 19,451 commits, 2.39 GB, 47m17s, and it FAILED with
#   6 findings — every one of them in code this project did not write and cannot fix:
#     3x dep/mysqllite/mysys/mf_keycache.c   (vendored MySQL, upstream commit, 2016)
#     1x deps/gsoap/stdsoap2.cpp             (vendored gSOAP)
#     2x data/sql/base/db_auth/updates.sql   (upstream SQL)
#   They are false positives — `keycache->disk_blocks` and friends clear the
#   `generic-api-key` entropy threshold. So the check could never go green, and a
#   check that is permanently red is worse than no check at all: it gates nothing,
#   because the only way to merge past it is to ignore it.
#
#   The question worth asking on every commit is "did WE just add a secret", not
#   "does 20 years of vendored third-party C contain a high-entropy string". So the
#   gating job scans only the commits the event actually introduces. It runs in
#   seconds instead of 47 minutes, and it has no upstream false positives to
#   suppress. Full history is still available on demand via workflow_dispatch,
#   where .gitleaksignore silences the six known upstream findings.
name: wvp-secret-scan

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned deliberately. `:latest` means a new detection rule shipped upstream can
  # turn this repository's CI red overnight with no change of ours — the same
  # "permanently red check" failure this workflow was rewritten to escape.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0

jobs:
  # ---------------------------------------------------------------- gating job
  new-commits:
    name: gitleaks (new commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the range below needs both endpoints present locally.
          fetch-depth: 0
          # For a PR, check out the head commit itself rather than the synthetic
          # merge commit, so the range endpoints match what the scan reports.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Work out which commits this event introduces
        id: range
        run: |
          zero=0000000000000000000000000000000000000000
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              base=""
              head="${{ github.sha }}"
              ;;
          esac

          # A branch that was just created reports an all-zero "before", and a
          # force-push can report a commit that no longer exists. Neither is a
          # reason to skip scanning, so fall back to the tip commit alone.
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if git cat-file -e "${head}~1^{commit}" 2>/dev/null; then
              base="${head}~1"
            else
              base=""
            fi
          fi

          if [ -n "$base" ]; then
            range="${base}..${head}"
          else
            range="$head"
          fi

          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning range: $range"
          git log --oneline "$range" | sed 's/^/  /' || true

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect \
              --source=/repo \
              --log-opts="${{ steps.range.outputs.range }}" \
              --redact \
              --verbose \
              --exit-code=1

  # ------------------------------------------------------------ gating job (2)
  credential-shapes:
    name: no credential-shaped files tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check
        run: |
          # Matched by SHAPE, not by exact name. The file that prompted this
          # (.db_password.txt, generated into the build tree) would otherwise
          # reappear unprotected under any regenerated variant name.
          bad=$(git ls-files | grep -Ei '(^|/)\.env$|\.password$|password.*\.txt$|credentials|\.secret$' || true)
          if [ -n "$bad" ]; then
            echo "::error::credential-shaped files must not be tracked in this fork:"
            echo "$bad"
            exit 1
          fi
          echo "OK - no credential-shaped files tracked."

  # ------------------------------------------------- on demand, never a gate
  full-history:
    name: gitleaks (full history, on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Measured at 47m17s over 19,451 commits. Generous ceiling so a slow run
    # reports a result rather than being killed at the default 360m.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect \
              --source=/repo \
              --redact \
              --verbose \
              --exit-code=1
